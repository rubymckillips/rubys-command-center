services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a local PostgreSQL user in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password in .env}
      POSTGRES_DB: ps3_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ps3-postgres:/var/lib/postgresql/data
      - ./server/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d ps3_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ps3-postgres:
